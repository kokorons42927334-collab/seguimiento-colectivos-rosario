<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento Colectivos Rosario</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    
    .info-box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .info-box h3 { margin: 0 0 2px 0; font-size: 15px; color: #111; }
    .info-box p { margin: 0; font-size: 11px; color: #555; }

    /* ESTILO PERSONALIZADO DEL ÍCONO DE COLECTIVO */
    .bus-marker {
      background: #007bff;
      color: white;
      border: 2px solid white;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .bus-marker span {
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="info-box">
    <h3>🚌 Rosario Colectivos</h3>
    <p>Seguimiento en tiempo real</p>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Centro de Rosario
    const map = L.map('map').setView([-32.9468, -60.6393], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const marcadores = {};

    // Función para crear un ícono personalizado con la línea del colectivo
    function crearIconoColectivo(linea) {
      return L.divIcon({
        className: 'custom-bus-icon',
        html: `<div class="bus-marker"><span>🚌</span> ${linea}</div>`,
        iconSize: [60, 30],
        iconAnchor: [30, 15]
      });
    }

    socket.on('ubicaciones-iniciales', (colectivos) => {
      colectivos.forEach(actualizarPosicion);
    });

    socket.on('posicion-actualizada', (colectivo) => {
      actualizarPosicion(colectivo);
    });

    function actualizarPosicion(colectivo) {
      const { idColectivo, linea, lat, lng } = colectivo;

      if (marcadores[idColectivo]) {
        // Mover el marcador existente
        marcadores[idColectivo].setLatLng([lat, lng]);
      } else {
        // Crear el nuevo marcador con el ícono visual personalizado
        marcadores[idColectivo] = L.marker([lat, lng], {
          icon: crearIconoColectivo(linea)
        })
        .addTo(map)
        .bindPopup(`<b>Línea: ${linea}</b><br>Unidad: ${idColectivo}`);
      }
    }
  </script>
</body>
</html>
